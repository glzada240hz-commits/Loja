# Gera e TESTA o pacote do Bar do Guto para a loja num Windows real:
#   BarDoGuto-Instalador-<versão>.exe  (instalador)  e  BarDoGuto-<versão>-portatil.zip
# Os arquivos ficam nos "Artifacts" da execução e numa pré-release do GitHub.
name: Pacote Windows (loja)

on:
  workflow_dispatch:
  push:
    branches: [claude/gallant-hopper-i7t3xm]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/**'
      - 'deploy/windows/**'
      - 'package-lock.json'
      - '.github/workflows/pacote-windows.yml'

permissions:
  contents: write

concurrency:
  group: pacote-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Compilar
        run: npm run build

      - name: Testes unitários
        run: npm run test:unit

      - name: Montar o pacote
        run: node scripts/empacotar-windows.mjs

      - name: Incluir o túnel do cardápio na internet (cloudflared)
        shell: pwsh
        run: |
          # túnel gratuito da Cloudflare (Apache-2.0), usado só quando o dono liga "Cardápio digital na internet"
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe' -OutFile 'dist-windows\BarDoGuto\runtime\cloudflared.exe'
          & 'dist-windows\BarDoGuto\runtime\cloudflared.exe' --version
          if ($LASTEXITCODE -ne 0) { throw 'cloudflared não executou' }
          "cloudflared: $(& 'dist-windows\BarDoGuto\runtime\cloudflared.exe' --version)" | Add-Content 'dist-windows\BarDoGuto\versao.txt'

      - name: Compilar o lançador BarDoGuto.exe
        shell: pwsh
        run: |
          $csc = Get-ChildItem "$env:WINDIR\Microsoft.NET\Framework64" -Recurse -Filter csc.exe | Sort-Object FullName -Descending | Select-Object -First 1
          & $csc.FullName /nologo /target:winexe /platform:x64 /optimize+ /codepage:65001 /r:System.Windows.Forms.dll /r:System.Drawing.dll "/win32icon:deploy\windows\BarDoGuto.ico" "/out:dist-windows\BarDoGuto\BarDoGuto.exe" deploy\windows\BarDoGuto.cs
          if ($LASTEXITCODE -ne 0) { throw "falha ao compilar o lançador" }

      - name: Teste no Windows — aplicativo sem console, primeira abertura, login, pedido, impressora da cozinha, encerramento seguro, reabertura e cópia de segurança
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dados = Join-Path $env:RUNNER_TEMP 'dados-loja'
          $exe = Resolve-Path 'dist-windows\BarDoGuto\BarDoGuto.exe'
          function Start-Loja($extra) {
            $a = @('--sem-pausa', '--dados', $dados, '--porta', '3500', '--sem-navegador') + $extra
            return Start-Process -FilePath $exe -ArgumentList $a -PassThru
          }
          function Show-Registro { Get-ChildItem (Join-Path $dados 'registros') -Filter *.txt -ErrorAction SilentlyContinue | Get-Content }
          # BarDoGuto.exe precisa ser aplicativo de janela (subsistema GUI = 2), não de console
          $bytes = [IO.File]::ReadAllBytes($exe)
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $subsistema = [BitConverter]::ToUInt16($bytes, $pe + 0x5C)
          if ($subsistema -ne 2) { throw "BarDoGuto.exe não é aplicativo de janela (subsistema $subsistema)" }
          Write-Host 'OK: BarDoGuto.exe é aplicativo de janela (sem console)'
          function Wait-Health($p) {
            for ($i = 0; $i -lt 120; $i++) {
              if ($p.HasExited) { break }
              try { if ((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:3500/api/health).StatusCode -eq 200) { return } } catch {}
              Start-Sleep -Seconds 1
            }
            Show-Registro
            throw 'o sistema não respondeu'
          }
          function Stop-Loja($p) {
            # encerramento seguro, como o menu "Encerrar" e o instalador fazem
            $e = Start-Process -FilePath $exe -ArgumentList '--encerrar' -PassThru -Wait
            if ($e.ExitCode -ne 0 -or -not $p.WaitForExit(60000)) { Show-Registro; throw 'o aplicativo não encerrou' }
            if (Test-Path (Join-Path $dados 'banco\postmaster.pid')) { Show-Registro; throw 'o banco não foi encerrado com segurança' }
            if (Get-Process node -ErrorAction SilentlyContinue | Where-Object { $_.Path -like '*dist-windows*' }) { throw 'node.exe ficou aberto' }
            Write-Host 'OK: encerrado com segurança (banco parado, sem processos restantes)'
          }
          $h = @{ 'x-requested-with' = 'guto' }
          $pw = 'TesteWindows-' + (Get-Random)

          $p = Start-Loja @('--nao-interativo', '--senha-admin', $pw, '--exemplo')
          Wait-Health $p
          $s = $null
          Invoke-RestMethod -Method Post -Uri http://127.0.0.1:3500/api/auth/login -Headers $h -ContentType 'application/json' -Body (@{ username = 'admin'; password = $pw } | ConvertTo-Json) -SessionVariable s | Out-Null
          $menu = Invoke-RestMethod -Uri http://127.0.0.1:3500/api/menu -WebSession $s
          $produtos = ($menu | ForEach-Object { $_.products } | Measure-Object).Count
          if ($produtos -lt 1) { throw 'cardápio de exemplo não carregou' }
          try { Invoke-RestMethod -Method Post -Uri http://127.0.0.1:3500/api/auth/login -Headers $h -ContentType 'application/json' -Body '{"username":"caixa","password":"demo1234"}'; throw 'usuário de demonstração existe no modo loja' } catch { if ($_.Exception.Message -like '*demonstração*') { throw } }
          Invoke-RestMethod -Method Post -Uri http://127.0.0.1:3500/api/day/open -Headers $h -WebSession $s -ContentType 'application/json' -Body '{}' | Out-Null
          Invoke-RestMethod -Method Post -Uri http://127.0.0.1:3500/api/cash/open -Headers $h -WebSession $s -ContentType 'application/json' -Body '{"openingCents":10000}' | Out-Null
          $variant = $menu[0].products[0].variants[0].id
          $body = @{ type = 'counter'; send = $true; items = @(@{ variantId = $variant; quantity = 2 }) } | ConvertTo-Json -Depth 5
          $pedido = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:3500/api/orders -Headers ($h + @{ 'idempotency-key' = [guid]::NewGuid().ToString() }) -WebSession $s -ContentType 'application/json' -Body $body
          Write-Host "Pedido #$($pedido.number) total $($pedido.totalCents) centavos"
          # duas impressoras: a via da cozinha sai pelo BarDoGuto.exe na impressora escolhida (aqui: Microsoft Print to PDF)
          $listaImp = Get-Content (Join-Path $dados 'impressao\impressoras.txt') -ErrorAction SilentlyContinue
          Write-Host 'Impressoras vistas pelo aplicativo:'; $listaImp
          if (-not $listaImp) { Show-Registro; throw 'o aplicativo não listou as impressoras' }
          $pdfLinha = $listaImp | Where-Object { $_ -like 'IMPRESSORA*Microsoft Print to PDF*' } | Select-Object -First 1
          if ($pdfLinha) {
            $pdfNome = $pdfLinha.Split("`t")[1]
            Invoke-RestMethod -Method Post -Uri http://127.0.0.1:3500/api/system/kitchen-printer -Headers $h -WebSession $s -ContentType 'application/json' -Body (@{ name = $pdfNome } | ConvertTo-Json) | Out-Null
            Start-Sleep -Seconds 2
            $menu2 = Invoke-RestMethod -Uri http://127.0.0.1:3500/api/menu -WebSession $s
            $cozinhaCat = $menu2 | Where-Object { $_.sendToKitchen } | Select-Object -First 1
            $bodyK = @{ type = 'table'; tableLabel = '7'; send = $true; items = @(@{ variantId = $cozinhaCat.products[0].variants[0].id; quantity = 1 }) } | ConvertTo-Json -Depth 5
            $pk = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:3500/api/orders -Headers ($h + @{ 'idempotency-key' = [guid]::NewGuid().ToString() }) -WebSession $s -ContentType 'application/json' -Body $bodyK
            $arqs = $null
            for ($i = 0; $i -lt 45; $i++) {
              $arqs = Get-ChildItem (Join-Path $dados 'impressao\arquivos') -Filter *.pdf -ErrorAction SilentlyContinue | Where-Object { $_.Length -gt 0 }
              if ($arqs -and (Test-Path (Join-Path $dados 'impressao\estado.txt'))) { break }
              Start-Sleep -Seconds 1
            }
            if (-not $arqs -or -not (Test-Path (Join-Path $dados 'impressao\estado.txt'))) { Get-Content (Join-Path $dados 'impressao\estado.txt') -ErrorAction SilentlyContinue; Show-Registro; throw 'a via da cozinha não foi impressa na impressora escolhida' }
            $estado = Get-Content (Join-Path $dados 'impressao\estado.txt') -Raw
            if ($estado -notlike 'OK*') { Show-Registro; throw "impressão da cozinha com erro: $estado" }
            Write-Host "OK: via da cozinha do pedido #$($pk.number) impressa em '$pdfNome': $($arqs[0].Name) ($($arqs[0].Length) bytes) — $estado"
            Invoke-RestMethod -Method Post -Uri http://127.0.0.1:3500/api/system/kitchen-printer -Headers $h -WebSession $s -ContentType 'application/json' -Body '{"name":""}' | Out-Null
          } else {
            Write-Warning 'Microsoft Print to PDF não existe neste Windows: a impressão na impressora escolhida não foi testada aqui'
          }

          # cardápio na internet: liga o túnel, abre o cardápio pelo endereço público e confere o porteiro
          Invoke-RestMethod -Method Put -Uri http://127.0.0.1:3500/api/settings -Headers $h -WebSession $s -ContentType 'application/json' -Body '{"publicMenuOnline":true}' | Out-Null
          $pub = $null
          for ($i = 0; $i -lt 60; $i++) {
            $pub = Invoke-RestMethod -Uri http://127.0.0.1:3500/api/system/public-link -WebSession $s
            if ($pub.status -eq 'online') { break }
            Start-Sleep -Seconds 1
          }
          Write-Host "Túnel: $($pub.status) $($pub.menuUrl) $($pub.error)"
          $tunelRes = "Cardapio na internet (teste automatico): tunel $($pub.status)"
          if ($pub.status -eq 'online') {
            $okMenu = $false
            for ($i = 0; $i -lt 30 -and -not $okMenu; $i++) {
              try { $r = Invoke-WebRequest -UseBasicParsing $pub.menuUrl; $okMenu = ($r.StatusCode -eq 200 -and $r.Content -like '*Bar do Guto*') } catch { Start-Sleep -Seconds 2 }
            }
            if ($okMenu) {
              $bloq = $(try { (Invoke-WebRequest -UseBasicParsing "$($pub.url)/api/orders").StatusCode } catch { [int]$_.Exception.Response.StatusCode })
              $api = (Invoke-WebRequest -UseBasicParsing "$($pub.url)/api/public/menu").StatusCode
              Write-Host "OK: cardápio abriu pela internet ($($pub.menuUrl)); /api/public/menu=$api; /api/orders de fora=$bloq"
              $tunelRes = "Cardapio na internet (teste automatico): abriu pelo endereco publico; API interna bloqueada de fora (status $bloq)"
              if ($bloq -ne 404) { throw "API interna acessível pela internet (status $bloq)" }
            } else { Write-Warning 'túnel no ar, mas o endereço público ainda não respondeu (DNS do túnel gratuito pode demorar)'; $tunelRes = 'Cardapio na internet (teste automatico): tunel no ar, endereco publico nao respondeu a tempo' }
          } else { Write-Warning "túnel não ficou no ar neste Windows: $($pub.error)"; $tunelRes = "Cardapio na internet (teste automatico): tunel nao ficou no ar ($($pub.error))" }
          $tunelRes | Set-Content (Join-Path $env:RUNNER_TEMP 'tunel.txt')
          Invoke-RestMethod -Method Put -Uri http://127.0.0.1:3500/api/settings -Headers $h -WebSession $s -ContentType 'application/json' -Body '{"publicMenuOnline":false}' | Out-Null

          $html = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:3500/).Content
          if ($html -notlike '*Bar do Guto*') { throw 'interface não carregou' }
          # abrir de novo não cria segunda cópia: só pede para mostrar a janela e sai
          $p2 = Start-Loja @()
          if (-not $p2.WaitForExit(20000)) { throw 'segunda abertura não terminou' }
          if ($p.HasExited) { throw 'a primeira cópia fechou' }
          Write-Host 'OK: segunda abertura não duplicou o sistema'
          $reg = (Show-Registro) -join "`n"
          if ($reg -like "*$pw*") { throw 'a senha apareceu no registro' }
          Stop-Loja $p

          # reabertura: mesmos dados, cópia de segurança do dia criada
          $p = Start-Loja @()
          Wait-Health $p
          Invoke-RestMethod -Method Post -Uri http://127.0.0.1:3500/api/auth/login -Headers $h -ContentType 'application/json' -Body (@{ username = 'admin'; password = $pw } | ConvertTo-Json) -SessionVariable s2 | Out-Null
          $lista = Invoke-RestMethod -Uri 'http://127.0.0.1:3500/api/orders?status=open,pending,closed' -WebSession $s2
          if (-not ($lista | Where-Object { $_.number -eq $pedido.number })) { throw 'pedido não persistiu após reabrir' }
          $copias = Get-ChildItem (Join-Path $dados 'copias-de-seguranca') -Directory
          if ($copias.Count -lt 1) { throw 'cópia de segurança não foi criada' }
          Write-Host "OK: dados persistiram; cópias de segurança: $($copias.Name -join ', ')"
          Stop-Loja $p

      - name: Gerar instalador e zip
        shell: pwsh
        run: |
          $v = (Get-Content apps/web/dist/version.json | ConvertFrom-Json).id -replace '\+', '-'
          echo "VERSAO=$v" >> $env:GITHUB_ENV
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$v" "/DSourceDir=$PWD\dist-windows\BarDoGuto" "/DOutputDir=$PWD\dist-windows" deploy\windows\BarDoGuto.iss
          if ($LASTEXITCODE -ne 0) { throw 'falha ao gerar o instalador' }
          Compress-Archive -Path dist-windows\BarDoGuto -DestinationPath "dist-windows\BarDoGuto-$v-portatil.zip"
          Get-ChildItem dist-windows -File | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: BarDoGuto-${{ env.VERSAO }}
          path: |
            dist-windows/BarDoGuto-Instalador-*.exe
            dist-windows/BarDoGuto-*-portatil.zip
          retention-days: 30

      - name: Publicar pré-release com o instalador
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "loja-$env:VERSAO"
          gh release delete $tag --yes --cleanup-tag 2>$null
          $tunel = Get-Content (Join-Path $env:RUNNER_TEMP 'tunel.txt') -ErrorAction SilentlyContinue
          gh release create $tag --target $env:GITHUB_SHA --prerelease --title "Bar do Guto - loja $env:VERSAO" --notes "Instalador para Windows gerado e testado automaticamente num Windows (primeira abertura, login, pedido, impressora da cozinha, reabertura e copia de seguranca). $tunel. Baixe BarDoGuto-Instalador-*.exe." (Get-ChildItem dist-windows\BarDoGuto-Instalador-*.exe).FullName (Get-ChildItem dist-windows\BarDoGuto-*-portatil.zip).FullName
